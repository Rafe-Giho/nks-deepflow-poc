apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-auth
  namespace: sidecarless-observability
type: Opaque
stringData:
  CLICKHOUSE_USER: poc
  CLICKHOUSE_PASSWORD: poc-password
  CLICKHOUSE_GRAFANA_USER: grafana
  CLICKHOUSE_GRAFANA_PASSWORD: grafana-readonly
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-initdb
  namespace: sidecarless-observability
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS sidecarless;

    CREATE TABLE IF NOT EXISTS sidecarless.network_events
    (
      ts DateTime64(3, 'Asia/Seoul'),
      event_source LowCardinality(String),
      event_scope LowCardinality(String),
      cluster_name LowCardinality(String),
      node_name String,
      verdict LowCardinality(String),
      event_type LowCardinality(String),
      source_namespace LowCardinality(String),
      source_pod String,
      source_ip String,
      destination_namespace LowCardinality(String),
      destination_pod String,
      destination_ip String,
      l4_protocol LowCardinality(String),
      destination_port UInt32,
      event_json String,
      inserted_at DateTime DEFAULT now()
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMMDD(ts)
    ORDER BY (ts, event_source, source_namespace, source_pod, destination_namespace, destination_pod)
    TTL toDateTime(ts) + INTERVAL 7 DAY;

    CREATE USER IF NOT EXISTS grafana IDENTIFIED BY 'grafana-readonly';
    GRANT SELECT ON sidecarless.* TO grafana;
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: sidecarless-observability
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: sidecarless-observability
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: sidecarless-poc
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              value: sidecarless
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: initdb
          configMap:
            name: clickhouse-initdb
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
