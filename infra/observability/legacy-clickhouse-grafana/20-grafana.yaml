apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: sidecarless-observability
data:
  clickhouse-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: ClickHouse
        uid: ClickHouse
        type: grafana-clickhouse-datasource
        access: proxy
        isDefault: true
        jsonData:
          host: clickhouse.sidecarless-observability.svc.cluster.local
          port: 8123
          protocol: http
          username: grafana
          defaultDatabase: sidecarless
          secure: false
        secureJsonData:
          password: ${CLICKHOUSE_GRAFANA_PASSWORD}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: sidecarless-poc
        orgId: 1
        folder: Sidecarless PoC
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  nks-network-events-dashboard.json: |
    {
      "title": "NHN NKS Sidecarless Network Events",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Flow Count",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse" },
              "rawSql": "SELECT toStartOfMinute(ts) AS time, count() AS events FROM sidecarless.network_events WHERE $__timeFilter(ts) GROUP BY time ORDER BY time"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Verdict / Action",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse" },
              "rawSql": "SELECT verdict, count() AS events FROM sidecarless.network_events WHERE $__timeFilter(ts) GROUP BY verdict ORDER BY events DESC"
            }
          ]
        },
        {
          "type": "table",
          "title": "Top Source -> Destination",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 9 },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse" },
              "rawSql": "SELECT event_source, source_namespace, source_pod, source_ip, destination_namespace, destination_pod, destination_ip, destination_port, count() AS events FROM sidecarless.network_events WHERE $__timeFilter(ts) GROUP BY event_source, source_namespace, source_pod, source_ip, destination_namespace, destination_pod, destination_ip, destination_port ORDER BY events DESC LIMIT 50"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sidecarless-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sidecarless-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: sidecarless-poc
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              value: grafana-clickhouse-datasource
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: CLICKHOUSE_GRAFANA_PASSWORD
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/clickhouse-datasource.yaml
              subPath: clickhouse-datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/nks-network-events-dashboard.json
              subPath: nks-network-events-dashboard.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
