apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-was
  namespace: sidecarless-smoke
  labels:
    app: smoke-was
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smoke-was
  template:
    metadata:
      labels:
        app: smoke-was
        app.kubernetes.io/part-of: sidecarless-poc
    spec:
      containers:
        - name: was
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=smoke-was"
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-was
  namespace: sidecarless-smoke
  labels:
    app: smoke-was
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  selector:
    app: smoke-was
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-db
  namespace: sidecarless-smoke
  labels:
    app: smoke-db
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-db
  template:
    metadata:
      labels:
        app: smoke-db
        app.kubernetes.io/part-of: sidecarless-poc
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: smoke-db-auth
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - smoke
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-db
  namespace: sidecarless-smoke
  labels:
    app: smoke-db
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  selector:
    app: smoke-db
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: postgres
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: http-traffic
  namespace: sidecarless-smoke
  labels:
    app: http-traffic
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  schedule: "*/5 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: http-traffic
            app.kubernetes.io/part-of: sidecarless-poc
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    curl -fsS http://smoke-was.sidecarless-smoke.svc.cluster.local:8080/ >/dev/null
                    sleep 1
                  done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sql-traffic
  namespace: sidecarless-smoke
  labels:
    app: sql-traffic
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  schedule: "*/5 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: sql-traffic
            app.kubernetes.io/part-of: sidecarless-poc
        spec:
          restartPolicy: Never
          containers:
            - name: psql
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: smoke-db-auth
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: smoke-db-auth
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 10); do
                    psql -h smoke-db.sidecarless-smoke.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select now();" >/dev/null
                    sleep 1
                  done
