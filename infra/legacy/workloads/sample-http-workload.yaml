apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: sidecarless-demo
  labels:
    app.kubernetes.io/name: echo-server
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-server
        app.kubernetes.io/part-of: sidecarless-poc
    spec:
      containers:
        - name: echo-server
          image: hashicorp/http-echo:0.2.3
          args:
            - -listen=:8080
            - -text=sidecarless-poc
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: sidecarless-demo
  labels:
    app.kubernetes.io/name: echo-server
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  selector:
    app.kubernetes.io/name: echo-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: traffic-generator
  namespace: sidecarless-demo
  labels:
    app.kubernetes.io/name: traffic-generator
    app.kubernetes.io/part-of: sidecarless-poc
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: traffic-generator
            app.kubernetes.io/part-of: sidecarless-poc
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.13.0
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 30); do
                    curl -fsS http://echo-server.sidecarless-demo.svc.cluster.local/ >/dev/null
                    sleep 1
                  done
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
