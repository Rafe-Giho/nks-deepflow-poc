apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: giho@jininfra.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        gatewayHTTPRoute:
          serviceType: ClusterIP
          parentRefs:
            - name: sgh-web-gateway
              namespace: sgh-web-ns
              kind: Gateway
              sectionName: http
